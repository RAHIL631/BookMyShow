{% extends "users/basic.html" %}

{% block title %}Password Changed - BookMySeat{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="glass p-5 rounded-lg fade-in">
                <div class="mb-4">
                    <i class="bi bi-check-circle-fill display-1 text-success"></i>
                </div>
                <h2 class="text-white font-weight-bold mb-3">All Set!</h2>
                <p class="text-muted">Your password has been successfully reset. You can now log in with your new password.</p>
                <hr class="border-secondary my-4">
                <a href="{% url 'login' %}" class="btn btn-primary px-5 rounded-pill font-weight-bold">
                    Log In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
