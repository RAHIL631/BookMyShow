{% extends "users/basic.html" %}

{% block title %}Email Sent - BookMySeat{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="glass p-5 rounded-lg fade-in">
                <div class="mb-4">
                    <i class="bi bi-envelope-check display-1 text-primary"></i>
                </div>
                <h2 class="text-white font-weight-bold mb-3">Email Sent!</h2>
                <p class="text-muted">We've sent an email with instructions to reset your password. Please check your inbox.</p>
                <hr class="border-secondary my-4">
                <p class="text-muted small">Didn't receive the email? Check your spam folder or <a href="{% url 'password_reset' %}" class="text-primary text-decoration-none">try again</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
