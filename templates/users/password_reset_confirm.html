{% extends "users/basic.html" %}

{% block title %}New Password - BookMySeat{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass p-4 p-md-5 rounded-lg fade-in">
                <div class="text-center mb-4">
                    <h2 class="text-white font-weight-bold">New Password</h2>
                    <p class="text-muted small">Please enter your new password twice to confirm.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="form-group mb-4">
                        <label class="text-muted small font-weight-bold">{{ field.label }}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-right-0 rounded-left-pill text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" name="{{ field.name }}" class="form-control bg-dark border-left-0 rounded-right-pill text-white" placeholder="Enter new password" required>
                        </div>
                        {% if field.errors %}
                        <div class="text-danger small mt-1 pl-3">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary btn-block rounded-pill py-2 font-weight-bold">
                        Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .input-group-text { border-color: var(--glass-border); }
    .form-control { border-color: var(--glass-border); }
    .form-control:focus { background: #111 !important; border-color: var(--primary-color); box-shadow: none; }
</style>
{% endblock %}
